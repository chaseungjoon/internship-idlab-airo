#   git submodule update --init airo-mono
#   conda env create -f environment.yaml
#   conda activate int2026
# (run from the repo root, so the airo-mono/ editable-install paths below resolve)
name: int2026
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.*
  - scipy
  - matplotlib
  - numpy
  - pip
  - loguru
  - overrides
  - requests
  - jupyter
  - ipywidgets
  - treelib
  - pip:
      - drake==1.32.0
      - ompl
      - "linen @ git+https://github.com/Victorlouisdg/linen@main#subdirectory=linen"
      - -e airo-mono/airo-typing/
      - -e airo-mono/airo-spatial-algebra/
      - -e airo-mono/airo-camera-toolkit/
      - -e "airo-mono/airo-robots/[ur,realman]"
      - -e airo-mono/airo-dataset-tools/
      - airo-drake
      - airo-planner
      - Robotic_Arm
